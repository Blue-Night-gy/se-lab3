<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>泊序 · 设计预览</title><link rel="stylesheet" href="ui.css"><style>main{max-width:1260px;margin:50px auto}.directory{display:grid;grid-template-columns:repeat(4,1fr);gap:17px}.tile{padding:24px;border:1px solid #dfe5ef;border-radius:5px;background:white}.tile:hover{border-color:#7799c9;background:#f7faff}.tile small{font-size:10px;letter-spacing:1px;color:#6d8bb5}.tile h3{margin:12px 0 8px;font-size:14px}.tile p{font-size:10px;color:#8797b0;margin:0}.group{font-size:16px;margin:35px 0 20px}</style></head><body><header class="nav-main"><a class="brand blue" href="/">泊序 <small>DESIGN PREVIEW</small></a><span class="small muted">本地23屏设计目录 · 保存后页面自动刷新</span></header><main><span class="label">酒店预订与运营 / 实验二</span><h1 style="margin-top:15px">从查房, 到整单分房.</h1><p class="muted small">2间3晚的报价、确认周期、分房及间夜统计, 使用同一套设计约定.</p><div id="directory"></div></main><script>fetch('screens.json').then(r=>r.json()).then(all=>{const groups=[['顾客预订',all.filter(s=>Number(s.id.slice(3))<=10||Number(s.id.slice(3))>=22)],['酒店与平台运营',all.filter(s=>Number(s.id.slice(3))>=11&&Number(s.id.slice(3))<=21)]];document.getElementById('directory').innerHTML=groups.map(([name,rows])=>`<h2 class="group">${name}</h2><div class="directory">${rows.map(s=>`<a class="tile" href="ui.html?screen=${s.key}"><small>${s.id}　↗</small><h3>${s.name}</h3><p>${s.module}</p></a>`).join('')}</div>`).join('')})</script></body></html>
